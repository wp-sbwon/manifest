# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: pytest-check
        name: Run pytest (quick check)
        entry: bash -c 'source venv/bin/activate 2>/dev/null || true; PYTHONPATH=src pytest tests/ -q --tb=no -x'
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]  # Only run on push, not every commit
      - id: ci-readiness-check
        name: Check CI readiness (imports and syntax)
        entry: bash -c 'source venv/bin/activate 2>/dev/null || true; PYTHONPATH=src python -c "from manifest.core.ci_monitor import verify_ci_readiness; import sys; result = verify_ci_readiness(); sys.exit(0 if result[\"ready\"] else 1)"'
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]  # Only run on push
      - id: check-github-ci-status
        name: Check GitHub CI status before push
        entry: bash -c 'source venv/bin/activate 2>/dev/null || true; python scripts/check_ci_status.py'
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]  # Only run on push
        verbose: true
