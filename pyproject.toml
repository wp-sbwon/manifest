[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "aiofiles.*",
    "docker.*",
    "httpx.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".tox", "dist", "build", "*.egg", "__pycache__", "tests/archive"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project]
name = "manifest"
version = "0.1.0"
description = "AI-Native Orchestration IDE"
requires-python = ">=3.10"
[project.scripts]
manifest = "manifest.__main__:main"
dependencies = [
    "urllib3>=1.26.18,<2",
    "textual>=0.40.0",
    "aiofiles>=23.2.0",
    "cryptography>=41.0.0",
    "tree-sitter>=0.20.0",
    "GitPython>=3.1.40",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
    "docker>=6.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "psutil>=5.9.0",
    "opencode-ai>=1.0.0",  # 기본 dependency로 포함
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
