[pytest]
# Configure pytest for src/ layout and organized test structure
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Exclude source files from test collection
# TestAgent is a source class, not a test class
norecursedirs = .git .tox dist build *.egg __pycache__ tests/archive

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external services)
    slow: Slow-running tests
    skip: Skip this test
