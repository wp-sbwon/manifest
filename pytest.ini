[pytest]
# Configure pytest for src/ layout and organized test structure
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Exclude source files from test collection
# TestAgent is a source class, not a test class
norecursedirs = .git .tox dist build *.egg __pycache__ tests/fixtures

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (components together; may use tmp or fixtures)
    e2e: End-to-end tests (product intent: see what is built, how much is done)
    slow: Slow-running tests
    skip: Skip this test
    manifest_assertion(entity_id, assertion_index): Test is bound to a design assertion (generated stubs)
