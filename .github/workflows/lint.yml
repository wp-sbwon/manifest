# Disabled for now. Remove the "if: false" on the job to re-enable.
name: Lint

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        env:
          PYTHONPATH: src
        run: |
          python -c "from manifest.view.app import ManifestViewApp; print('✓ View imports OK')"
          python -c "from manifest.core.state_manager import StateManager; print('✓ Core imports OK')"
          python -c "from manifest.agents.agent_coordinator import AgentCoordinator; print('✓ Agent imports OK')"
          python -c "from manifest.bridge.agent_bridge import AgentBridge; print('✓ Bridge imports OK')"
          python -c "from manifest.runtime.agent.core.executor_factory import ExecutorFactory; print('✓ ExecutorFactory imports OK')"
          python -c "from manifest.runtime.agent.core import ExecutorFactory as EF; print('✓ ExecutorFactory lazy import OK')"

      - name: Check Python syntax
        run: |
          python -m py_compile src/manifest/**/*.py 2>&1 | head -20 || true
