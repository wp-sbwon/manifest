version: '3.8'

services:
  app:
    build: .
    container_name: manifest-app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"  # API endpoint for container communication
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - CONTAINER_MODE=true
    command: python -m manifest
    networks:
      - manifest-network

  # Agent services - each agent runs in its own container
  agent-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: manifest-agent-orchestrator
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - AGENT_TYPE=orchestrator
      - AGENT_MODE=container
    command: ["python", "-m", "manifest.agents.orchestrator"]
    networks:
      - manifest-network
    depends_on:
      - app

  agent-planner:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: manifest-agent-planner
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - AGENT_TYPE=planner
      - AGENT_MODE=container
    command: ["python", "-m", "manifest.agents.planner"]
    networks:
      - manifest-network
    depends_on:
      - app

  agent-coder:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: manifest-agent-coder
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - AGENT_TYPE=coder
      - AGENT_MODE=container
    command: ["python", "-m", "manifest.agents.coder"]
    networks:
      - manifest-network
    depends_on:
      - app

  agent-test:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: manifest-agent-test
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - AGENT_TYPE=test
      - AGENT_MODE=container
    command: ["python", "-m", "manifest.agents.test"]
    networks:
      - manifest-network
    depends_on:
      - app

  agent-review:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: manifest-agent-review
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - AGENT_TYPE=review
      - AGENT_MODE=container
    command: ["python", "-m", "manifest.agents.review"]
    networks:
      - manifest-network
    depends_on:
      - app

networks:
  manifest-network:
    driver: bridge
