version: '3.8'

services:
  app:
    build: .
    container_name: manifest-app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"  # API endpoint for container communication
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - CONTAINER_MODE=true
    command: python -m manifest
    networks:
      - manifest-network

  # Agent services (orchestrator, planner, coder, test, review) removed:
  # manifest.agents.* modules do not exist. Add them to re-enable agent containers.

networks:
  manifest-network:
    driver: bridge
